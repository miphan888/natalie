<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ecbff">
<title>Natalie's Garden — Vườn của Natalie</title>
<link rel="icon" href="heart-logo.png">
<style>
  :root {
    --ink: #241c16;
    --cream: #fffaf3;
    --muted: #5c564e;
    --line: #241c16;
    --sun: #ffc44d;
    --berry: #e23d5c;
    --leaf: #1f8a56;
    --sky: #9fd8f5;
    --card: #fffaf3;
  }
  * { box-sizing: border-box; }
  @font-face { font-family: Andika; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Andika; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Andika; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/vietnamese-400-normal.woff2") format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: Andika; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Andika; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Andika; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/vietnamese-700-normal.woff2") format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  html, body { margin: 0; padding: 0; font-family: Andika, "Segoe UI", sans-serif; }
  html { background: #7ecbff var(--garden-bg, url("scene.svg")) center / cover no-repeat fixed; min-height: 100%; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: #e7f6ff;
  }
  body.screen-home {
    background:
      radial-gradient(circle at 90% 6%, #ffe08a 0 46px, transparent 48px),
      linear-gradient(#9fd8f5 0 34%, #d7f3c4 34% 100%);
  }
  body.screen-parents, body.screen-chapter { background: #f3eadc; }
  body.screen-clear { background: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:active { transform: translate(2px, 2px); }
  :focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; }
  .cloud { display: none; position: fixed; background: #fff; border-radius: 40px; opacity: .88; pointer-events: none; z-index: 0; }
  body.screen-home .cloud { display: block; }
  .c1 { width: 130px; height: 36px; top: 22px; left: 6%; }
  .c2 { width: 84px; height: 28px; top: 58px; left: 18%; }
  .c3 { width: 100px; height: 30px; top: 36px; right: 18%; }
  #app { position: relative; z-index: 1; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px 16px 48px; }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; padding: 0; box-shadow: none; }
  .brand b { font-family: Georgia, "Palatino Linotype", serif; font-size: 22px; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tools button, .pill {
    border: 2px solid var(--ink);
    background: #fff;
    border-radius: 999px;
    padding: 6px 10px;
    font-weight: 800;
  }
  .tools button.on { background: var(--ink); color: #fff; }
  .namein {
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 6px 10px;
    width: 132px;
    font-weight: 800;
    background: #fff;
  }
  .jar {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 10px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dotberry { width: 14px; height: 14px; border-radius: 50%; background: var(--berry); border: 2px solid var(--ink); display: inline-block; }
  .hero { display: flex; gap: 14px; align-items: center; margin: 6px 0 16px; }
  .hero h1 { font-family: Georgia, "Palatino Linotype", serif; font-size: clamp(40px, 6vw, 64px); margin: 0; letter-spacing: -0.04em; line-height: .95; }
  .subname { margin: 2px 0 0; font-weight: 800; color: var(--berry); font-size: 22px; }
  .lede { margin: 8px 0 0; max-width: 46ch; line-height: 1.35; font-weight: 700; }
  .pip { width: 84px; height: 84px; flex: none; filter: drop-shadow(0 6px 0 rgba(180, 40, 80, .12)); }
  .introhead { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .introhead .pip { width: 92px; height: 92px; }
  .brand .pip { width: 40px; height: 40px; }
  .heart-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .heart-logo { width: 96px; height: 96px; display: block; }
  .brand .heart-wrap { width: 54px; height: 54px; }
  .brand .heart-logo { width: 54px; height: 54px; }
  .splash-card { display: flex; flex-direction: column; align-items: center; }
  .splash .heart-wrap { width: 280px; height: 280px; margin: 0 auto 6px; animation: heart-float 3.4s ease-in-out infinite; }
  .splash .heart-logo { width: 280px; height: 280px; }
  .splash .heart-wrap::after {
    content: ""; position: absolute; left: 18%; right: 18%; top: 8%; height: 46%;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.72) 50%, transparent 65%);
    animation: heart-shine 3.4s ease-in-out infinite;
    pointer-events: none; border-radius: 40%;
  }
  .introhead { justify-content: flex-start; }
  .introhead .heart-wrap { width: 132px; height: 132px; animation: heart-float 4s ease-in-out infinite; }
  .introhead .heart-logo { width: 132px; height: 132px; }
  @keyframes heart-float {
    0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 8px 10px rgba(180, 40, 80, .22)); }
    50% { transform: translateY(-7px) scale(1.035); filter: drop-shadow(0 16px 18px rgba(255, 120, 160, .45)); }
  }
  @keyframes heart-shine {
    0%, 100% { transform: translateX(-30%); opacity: 0; }
    45% { opacity: .85; }
    70% { transform: translateX(30%); opacity: 0; }
  }
  .bubble .pip { width: 52px; height: 52px; }
  @media (prefers-reduced-motion: no-preference) {
    .pip { animation: bob 2.6s ease-in-out infinite; }
  }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .beds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .bed {
    position: relative;
    text-align: left;
    background: var(--cream);
    border: 3px solid var(--ink);
    border-left: 12px solid var(--c, var(--sun));
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    min-height: 112px;
  }
  .bed:active { box-shadow: 2px 2px 0 var(--ink); }
  .bed .nm { font-weight: 800; font-size: 18px; display: block; }
  .bed .en { color: var(--muted); font-weight: 700; font-size: 13px; }
  .stars { letter-spacing: 1px; font-size: 16px; margin-top: 4px; color: #b08948; }
  .bed .num {
    display: inline-flex; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--ink); align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; margin-right: 4px; background: #fff;
  }
  .tag, .ribbon {
    display: inline-block;
    border: 2px solid var(--ink);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    padding: 1px 7px;
    margin-top: 4px;
    background: #fff;
  }
  .ribbon {
    position: absolute;
    top: -10px;
    right: 10px;
    background: var(--berry);
    color: #fff;
    margin: 0;
  }
  .plant { width: 54px; height: 56px; flex: none; }
  .doors { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .door {
    border: 3px solid var(--ink);
    background: var(--cream);
    border-radius: 16px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 12px 14px;
    font-weight: 800;
    text-align: left;
  }
  .door small { display: block; font-weight: 700; color: var(--muted); }
  .door.daily { background: var(--sun); }
  .door.book { background: #fff; }
  footer.note { color: var(--muted); font-size: 13px; margin-top: 22px; max-width: 78ch; line-height: 1.45; }
  .playtop, .rowhead { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); display: block; }
  .dots i.now { background: var(--sun); }
  .dots i.did { background: var(--leaf); }
  .playwrap { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 14px; align-items: start; }
  .playcard, .panel {
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 14px 14px 16px;
  }
  .chip {
    display: inline-flex;
    flex-direction: column;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 4px 10px;
    font-weight: 800;
    line-height: 1.15;
  }
  .chip small { font-weight: 700; font-size: 11px; opacity: .8; }
  .story { font-weight: 800; margin: 8px 0 0; }
  .headline {
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: clamp(42px, 8vw, 68px);
    text-align: center;
    letter-spacing: -0.04em;
    margin: 4px 0 8px;
    line-height: 1;
  }
  .make, .pair, .hops, .rodrow, .bond, .friendly-vis {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 4px 0 8px;
  }
  .bond { flex-direction: column; gap: 0; }
  .ten {
    display: grid;
    grid-template-columns: repeat(5, 28px);
    gap: 5px;
    padding: 8px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 14px;
  }
  .ten.mini { grid-template-columns: repeat(5, 16px); gap: 3px; padding: 5px; }
  .cell, .berry {
    width: 28px; height: 28px; border-radius: 50%;
    background: #f0e2d0; border: 2px solid var(--ink); display: inline-block;
  }
  .ten.mini .cell { width: 16px; height: 16px; }
  .cell.on, .berry { background: var(--berry); }
  .berry.hop, .cell.hop { background: var(--sun); }
  .berries, .ones { display: flex; flex-wrap: wrap; gap: 4px; max-width: 180px; }
  .ones .berry { width: 16px; height: 16px; }
  .opbig { font-size: 32px; font-weight: 800; }
  .rod {
    width: 36px; height: 72px;
    border: 3px solid var(--ink); border-radius: 8px;
    background: #ffd36e;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .rodgroup { display: flex; gap: 4px; align-items: flex-end; }
  .stone {
    min-width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff; font-weight: 800; font-size: 20px;
  }
  .stone.start { background: var(--sun); }
  .hopdot { width: 16px; height: 16px; border-radius: 50%; background: var(--leaf); border: 2px solid var(--ink); }
  .bwhole, .bpart {
    min-width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; background: #fff;
  }
  .bwhole { background: #fff3c4; }
  .barms { width: 86px; height: 16px; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
  .bparts { display: flex; gap: 28px; }
  .dice {
    display: grid; grid-template-columns: repeat(3, 14px); gap: 4px;
    padding: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 12px;
  }
  .pipdot { width: 14px; height: 14px; border-radius: 50%; background: transparent; }
  .pipdot.on { background: var(--ink); }
  .fn-num {
    width: 72px; height: 72px; border-radius: 18px;
    border: 3px solid var(--ink); background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800;
  }
  .fn-num.ten { background: #c9f0d6; }
  .eq { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-start; justify-content: center; margin: 8px 0; }
  .lit { min-height: 64px; display: inline-flex; align-items: center; font-weight: 800; font-size: 26px; }
  .field { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cap { font-size: 11px; font-weight: 800; color: var(--muted); max-width: 78px; text-align: center; line-height: 1.15; min-height: 1.15em; }
  .slot {
    width: 68px; height: 64px;
    border: 3px solid var(--ink); border-radius: 14px;
    background: #ffe9a8;
    font-size: 32px; font-weight: 800; text-align: center;
    padding: 0;
  }
  .slot.pre { background: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .slot.ok, .slot.pre.ok { background: #c9f0d6; }
  .slot.bad { background: #ffd0d0; }
  .slot.on { outline: 3px solid var(--berry); }
  .echo {
    min-width: 28px; height: 64px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 28px; color: #c4b8aa;
  }
  .echo.filled { color: var(--leaf); border-bottom: 3px solid var(--leaf); }
  .bubble {
    display: flex; gap: 10px; align-items: flex-start;
    background: #fff; border: 3px solid var(--ink); border-radius: 18px;
    padding: 10px; margin-top: 10px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .both p { margin: 0; font-weight: 800; line-height: 1.35; }
  .both .sec { color: var(--muted); font-weight: 700; font-size: .92em; margin-top: 3px; }
  .spks { display: flex; gap: 6px; margin-top: 6px; }
  .spk, .quiet {
    border: 2px solid var(--ink); background: #fff; border-radius: 999px;
    padding: 4px 8px; font-size: 13px; font-weight: 800;
  }
  .recap {
    margin-top: 8px; background: #e7f8ee; border-radius: 12px; padding: 8px 10px; font-weight: 800;
  }
  .sit {
    margin-top: 8px; background: #fff3c4; border-radius: 12px; padding: 8px 10px;
  }
  .banner {
    background: #fff3c4; border: 3px solid var(--ink); border-radius: 14px;
    padding: 8px 12px; font-weight: 800; margin-bottom: 10px;
  }
  .pad {
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 10px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key, .check, .lvbtn, .choice, .textbtn {
    border: 3px solid var(--ink);
    background: #fff;
    border-radius: 14px;
    box-shadow: 3px 3px 0 var(--ink);
    font-weight: 800;
  }
  .key { font-size: 28px; height: 62px; }
  .key:active, .check:active, .lvbtn:active, .choice:active, .textbtn:active { box-shadow: 0 0 0 var(--ink); }
  .check {
    margin-top: 8px; width: 100%; height: 58px; font-size: 22px;
    background: var(--leaf); color: #fff;
  }
  .check.ready { background: var(--sun); color: var(--ink); }
  .phone-check { width: 100%; margin-top: 12px; }
  .playwrap.native-keys { grid-template-columns: 1fr; }
  body.phone-keys .pad { display: none; }
  .typehint { display: none; color: var(--muted); font-size: 13px; text-align: center; margin: 6px 0 0; }
  @media (hover: hover) { .typehint { display: block; } }
  .hintrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .textbtn { background: #fff; padding: 8px 12px; }
  .textbtn.go { background: var(--leaf); color: #fff; }
  .textbtn.sun { background: var(--sun); }
  .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .lvbtn { text-align: left; padding: 10px; }
  .lvbtn small { display: block; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .lvbtn.lock { opacity: .5; }
  .dlgback {
    position: fixed; inset: 0; background: rgba(36, 28, 22, .35);
    display: flex; align-items: center; justify-content: center; z-index: 6; padding: 18px;
  }
  .dlg {
    background: var(--cream); border: 3px solid var(--ink); border-radius: 20px;
    box-shadow: 6px 6px 0 var(--ink); padding: 16px; max-width: 440px; width: 100%;
  }
  .dlg .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .clearwrap { position: relative; overflow: hidden; text-align: center; padding: 18px 8px 28px; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
  .clearcard {
    background: rgba(255, 250, 243, .96); border: 6px solid #fff; border-radius: 28px;
    padding: 18px 16px 16px; width: min(520px, calc(100% - 8px));
    box-shadow: 0 14px 0 rgba(255, 120, 170, .16);
  }
  .playcard.leaving { animation: cardOut .28s ease forwards; }
  .playcard.arriving, .clearcard.arriving { animation: cardIn .36s ease; }
  @keyframes cardOut { to { opacity: .15; transform: translateY(-14px) scale(.98); } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .clearwrap h2 { font-family: Georgia, serif; font-size: 40px; margin: 8px 0; }
  .bigstars { font-size: 42px; letter-spacing: 4px; }
  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti i { position: absolute; top: 0; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.3s ease-in forwards; }
  @keyframes fall { to { transform: translateY(78vh) rotate(180deg); opacity: .15; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-5px); }
    70% { transform: translateX(5px); }
  }
  .shake { animation: shake .35s linear; }
  .book { display: grid; grid-template-columns: 230px 1fr; gap: 14px; }
  .chapters { display: flex; flex-direction: column; gap: 6px; }
  .chapters button {
    text-align: left; border-radius: 12px; border: 2px solid var(--ink);
    background: #fff; padding: 8px 10px; font-weight: 800;
  }
  .chapters button.on { background: var(--ink); color: #fff; }
  .chapter h2 { font-family: Georgia, serif; margin: 0 0 6px; font-size: 34px; letter-spacing: -0.03em; }
  .school {
    display: inline-block; background: #efe6ff; border: 2px solid var(--ink);
    border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; margin-bottom: 8px;
  }
  .say, .watch, .idea {
    border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; margin: 12px 0;
  }
  .idea { background: #fff; }
  .say { background: #fff3c4; }
  .watch { background: #ffe1dc; }
  .say h3, .watch h3, .idea h3 { margin: 0 0 6px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  .gloss { display: grid; grid-template-columns: 1.1fr 1fr 1.3fr; gap: 6px; padding: 8px 0; border-bottom: 2px solid #eadfce; font-weight: 800; }
  .gloss i { font-style: normal; color: var(--muted); font-weight: 700; }
  .choice { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; }
  .choice.right { background: #c9f0d6; }
  .choice.wrong { background: #ffd0d0; }
  .solved-label { font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
  @media (max-width: 900px) {
